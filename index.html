<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Legal Metrology Compliance Inspector</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #121212; color: #fff; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #333; }
        .pass { color: #4CAF50; font-weight: bold; }
        .fail { color: #F44336; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚖️ Legal Metrology Packaging Audit</h2>
    <input type="file" id="imageInput" accept="image/*"><br><br>
    <button onclick="uploadImage()">Run Audit</button>

    <div id="results"></div>
</div>

<script>
async function uploadImage() {
    const input = document.getElementById('imageInput');
    if (!input.files[0]) return alert("Please select an image");

    const formData = new FormData();
    formData.append("file", input.files[0]);

    document.getElementById('results').innerHTML = "<p>Processing image...</p>";

    // Replace URL with your deployed backend API URL
    const response = await fetch("https://YOUR-BACKEND-API-URL.onrender.com/analyze", {
        method: "POST",
        body: formData
    });

    const data = await response.json();
    if (data.status === "error") {
        document.getElementById('results').innerHTML = `<p style="color:red">${data.message}</p>`;
        return;
    }

    let html = "<h3>Compliance Results</h3><table><tr><th>Rule</th><th>Detail</th><th>Status</th></tr>";
    data.report.forEach(r => {
        const statusClass = r.status === "PASS" ? "pass" : "fail";
        html += `<tr><td>${r.rule}</td><td>${r.detail}</td><td class="${statusClass}">${r.status}</td></tr>`;
    });
    html += "</table>";
    
    document.getElementById('results').innerHTML = html;
}
</script>

</body>
</html>
